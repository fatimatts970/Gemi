<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bulk Media Generator</title>
<style>
  :root{--bg:#0f0a12;--panel:#1c1120;--accent:#e0a12b;--text:#f2e9f5;--muted:#9d8aa5;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:20px;text-align:center;}
  header h1{margin:0;font-size:22px;}
  header p{color:var(--accent);font-size:12px;letter-spacing:1px;margin-top:6px;}
  .layout{display:flex;flex-direction:column;gap:16px;padding:16px;}
  .panel{background:var(--panel);border-radius:12px;padding:16px;}
  label{display:block;font-size:12px;color:var(--accent);text-transform:uppercase;margin-bottom:8px;letter-spacing:.5px;}
  textarea, select{width:100%;background:#2a1830;border:1px solid #3a2440;color:var(--text);border-radius:8px;padding:10px;font-size:14px;}
  textarea{min-height:100px;resize:vertical;}
  button{width:100%;background:var(--accent);color:#241705;border:none;padding:14px;border-radius:8px;font-weight:bold;font-size:15px;margin-top:10px;}
  button:disabled{opacity:.5;}
  .results{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .results img{width:100%;border-radius:8px;display:block;}
  .status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;}
</style>
</head>
<body>

<header>
  <h1>Bulk Media Generator</h1>
  <p>PRIVATE BUILD</p>
</header>

<div class="layout">
  <div class="panel">
    <label>Image Prompts (one per line)</label>
    <textarea id="prompts" placeholder="A vibrant oil painting of a futuristic city...
A minimalist vector logo of a wolf..."></textarea>
  </div>

  <div class="panel">
    <label>Aspect Ratio</label>
    <select id="aspect">
      <option value="1:1">Square (1:1)</option>
      <option value="16:9">Landscape (16:9)</option>
      <option value="9:16">Portrait (9:16)</option>
      <option value="4:3">Standard (4:3)</option>
      <option value="3:4">Standard Portrait (3:4)</option>
    </select>
  </div>

  <button id="genBtn" onclick="generateAll()">⚡ Generate Media</button>
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
</div>

<script>
const API_KEY = "__GEMINI_API_KEY__";
const MODEL = "gemini-2.5-flash-image-preview";

async function generateOne(prompt){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
  const body = { contents: [{ parts: [{ text: prompt }] }] };
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  const data = await res.json();
  const parts = data?.candidates?.[0]?.content?.parts || [];
  const imgPart = parts.find(p => p.inlineData);
  if(!imgPart) throw new Error("No image returned for: " + prompt);
  return `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
}

async function generateAll(){
  const raw = document.getElementById('prompts').value.trim();
  const status = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const btn = document.getElementById('genBtn');

  if(!raw){ status.textContent = "Pehle kam se kam ek prompt likho."; return; }
  if(API_KEY.includes("__GEMINI_API_KEY__")){
    status.textContent = "API key set nahi hai (build placeholder abhi replace nahi hua).";
    return;
  }

  const prompts = raw.split("\n").map(p=>p.trim()).filter(Boolean);
  resultsEl.innerHTML = "";
  btn.disabled = true;

  for(let i=0; i<prompts.length; i++){
    status.textContent = `Generating ${i+1}/${prompts.length}...`;
    try{
      const imgUrl = await generateOne(prompts[i]);
      const img = document.createElement('img');
      img.src = imgUrl;
      resultsEl.appendChild(img);
    }catch(err){
      status.textContent = "Error: " + err.message;
      console.error(err);
      break;
    }
  }
  status.textContent = "Done.";
  btn.disabled = false;
}
</script>

</body>
</html>
